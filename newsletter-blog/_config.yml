title: "What's New in AI"
description: "Daily AI newsletter — research, industry news, and community highlights"
baseurl: ""
url: ""
theme: minima
permalink: /:year/:month/:day/:title/
paginate: 10
paginate_path: "/page:num/"

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "AI Newsletter Bot"
